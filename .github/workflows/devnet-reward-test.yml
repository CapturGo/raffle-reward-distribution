name: Devnet Reward Test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: devnet-reward-test
  cancel-in-progress: false

jobs:
  send-devnet-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CAPTURGO_API_BASE_URL: ${{ secrets.CAPTURGO_API_BASE_URL }}
      CAPTURGO_ADMIN_BEARER_TOKEN: ${{ secrets.CAPTURGO_ADMIN_BEARER_TOKEN }}
      CAPTURGO_RAFFLE_CAMPAIGN_ID: ${{ secrets.CAPTURGO_RAFFLE_CAMPAIGN_ID }}
      CAPTURGO_DEVICE_ID: ${{ secrets.CAPTURGO_DEVICE_ID }}
      CAPTURGO_DEVICE_TYPE: ${{ secrets.CAPTURGO_DEVICE_TYPE }}
      PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
      PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
      DEVNET_SOLANA_RPC_URL: ${{ secrets.DEVNET_SOLANA_RPC_URL }}
      DEVNET_SOLANA_PRIVATE_KEY: ${{ secrets.DEVNET_SOLANA_PRIVATE_KEY }}
      DEVNET_TOKEN_ADDRESS: ${{ secrets.DEVNET_TOKEN_ADDRESS }}
      DEVNET_TOKEN_DECIMALS: ${{ secrets.DEVNET_TOKEN_DECIMALS }}
      DEVNET_TOKEN_SYMBOL: ${{ secrets.DEVNET_TOKEN_SYMBOL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send devnet rewards
        run: npm run distribute:devnet -- --yes --amount 0.01
