name: Devnet Reward Test

on:
  workflow_dispatch:
    inputs:
      amount:
        description: Devnet token amount to send to each winner
        required: true
        default: "0.01"
      iterations:
        description: Number of times to run the test payout
        required: true
        default: "1"
      interval_seconds:
        description: Seconds to wait between iterations
        required: true
        default: "120"
  schedule:
    # GitHub Actions scheduled workflows are not reliable at 2-minute intervals.
    # This runs every 10 minutes and loops 5 times with 120 seconds between runs.
    - cron: "*/10 * * * *"

concurrency:
  group: devnet-reward-test
  cancel-in-progress: false

jobs:
  send-devnet-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CAPTURGO_API_BASE_URL: ${{ secrets.CAPTURGO_API_BASE_URL }}
      CAPTURGO_ADMIN_BEARER_TOKEN: ${{ secrets.CAPTURGO_ADMIN_BEARER_TOKEN }}
      CAPTURGO_RAFFLE_CAMPAIGN_ID: ${{ secrets.CAPTURGO_RAFFLE_CAMPAIGN_ID }}
      CAPTURGO_DEVICE_ID: ${{ secrets.CAPTURGO_DEVICE_ID }}
      CAPTURGO_DEVICE_TYPE: ${{ secrets.CAPTURGO_DEVICE_TYPE }}
      PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
      PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
      DEVNET_SOLANA_RPC_URL: ${{ secrets.DEVNET_SOLANA_RPC_URL }}
      DEVNET_SOLANA_PRIVATE_KEY: ${{ secrets.DEVNET_SOLANA_PRIVATE_KEY }}
      DEVNET_TOKEN_ADDRESS: ${{ secrets.DEVNET_TOKEN_ADDRESS }}
      DEVNET_TOKEN_DECIMALS: ${{ secrets.DEVNET_TOKEN_DECIMALS }}
      DEVNET_TOKEN_SYMBOL: ${{ secrets.DEVNET_TOKEN_SYMBOL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send devnet rewards
        env:
          AMOUNT: ${{ github.event.inputs.amount || '0.01' }}
          ITERATIONS: ${{ github.event.inputs.iterations || '5' }}
          INTERVAL_SECONDS: ${{ github.event.inputs.interval_seconds || '120' }}
        run: |
          set -euo pipefail

          echo "Sending ${AMOUNT} devnet token(s) to each winner."
          echo "Iterations: ${ITERATIONS}; interval: ${INTERVAL_SECONDS}s"

          for run_number in $(seq 1 "${ITERATIONS}"); do
            echo "Starting devnet reward test iteration ${run_number}/${ITERATIONS}"
            npm run distribute:devnet -- --yes --amount "${AMOUNT}"

            if [ "${run_number}" -lt "${ITERATIONS}" ]; then
              sleep "${INTERVAL_SECONDS}"
            fi
          done
