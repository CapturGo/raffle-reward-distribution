name: Weekly Reward Distribution

on:
  workflow_dispatch:
  schedule:
    # Monday 00:10 ICT = Sunday 17:10 UTC.
    - cron: "10 17 * * 0"

concurrency:
  group: weekly-reward-distribution
  cancel-in-progress: false

jobs:
  distribute-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CAPTURGO_API_BASE_URL: ${{ secrets.CAPTURGO_API_BASE_URL }}
      CAPTURGO_ADMIN_BEARER_TOKEN: ${{ secrets.CAPTURGO_ADMIN_BEARER_TOKEN }}
      CAPTURGO_RAFFLE_CAMPAIGN_ID: ${{ secrets.CAPTURGO_RAFFLE_CAMPAIGN_ID }}
      CAPTURGO_DEVICE_ID: ${{ secrets.CAPTURGO_DEVICE_ID }}
      CAPTURGO_DEVICE_TYPE: ${{ secrets.CAPTURGO_DEVICE_TYPE }}
      PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
      PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
      REWARD_SOLANA_RPC_URL: ${{ secrets.REWARD_SOLANA_RPC_URL }}
      REWARD_SOLANA_PRIVATE_KEY: ${{ secrets.REWARD_SOLANA_PRIVATE_KEY }}
      REWARD_TOKEN_ADDRESS: ${{ secrets.REWARD_TOKEN_ADDRESS }}
      REWARD_TOKEN_DECIMALS: ${{ secrets.REWARD_TOKEN_DECIMALS }}
      REWARD_TOKEN_SYMBOL: ${{ secrets.REWARD_TOKEN_SYMBOL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preview weekly payouts
        run: npm run plan

      - name: Send weekly rewards
        run: npm run distribute -- --yes
